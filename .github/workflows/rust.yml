name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The repo pins nightly via rust-toolchain.toml, so install the
      # components on nightly (otherwise cargo fmt/clippy fail: the pinned
      # toolchain has no rustfmt/clippy). Nothing actually requires nightly --
      # switching rust-toolchain.toml to stable would make this more robust.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      # Build-time deps: GTK/appindicator (tray), xkbcommon/wayland/xdo
      # (windowing + tray), and openssl/pkg-config (google-fonts -> reqwest
      # -> native-tls -> openssl-sys). Without these, build scripts fail with
      # exit code 100.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libxdo-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            pkg-config

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-features --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-features
