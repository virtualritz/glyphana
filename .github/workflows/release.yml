# Release CI:
#
# * triggers on a pushed version tag (e.g. v0.2.2, v1.0.0-rc1)
# * builds native desktop packages with cargo-packager:
#     - Linux:   .deb + .AppImage  (x86_64)
#     - macOS:   .dmg              (x86_64 + aarch64)
#     - Windows: .msi              (x86_64)
# * creates a GitHub Release and uploads the packages + SHA256 checksums
#
# Packaging is configured in Cargo.toml under [package.metadata.packager].
name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build - ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}

    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x86_64
            os: ubuntu-22.04
            formats: deb appimage

          - name: macos-x86_64
            os: macos-13
            formats: dmg

          - name: macos-aarch64
            os: macos-14
            formats: dmg

          - name: windows-x86_64
            os: windows-latest
            formats: msi

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform.name }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libxdo-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            pkg-config \
            patchelf \
            libfuse2

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install cargo-packager
        run: cargo binstall -y cargo-packager

      - name: Build release binary
        run: cargo build --release

      - name: Package
        run: cargo packager --release --formats ${{ matrix.platform.formats }} --verbose

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: glyphana-${{ matrix.platform.name }}
          path: |
            dist/*.deb
            dist/*.AppImage
            dist/*.dmg
            dist/*.msi
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect packages and checksums
        run: |
          mkdir -p release
          # Flatten the per-platform artifact directories, tagging each file
          # with its platform so names don't collide across matrix legs.
          for dir in artifacts/glyphana-*; do
            platform=$(basename "$dir" | sed 's/^glyphana-//')
            for file in "$dir"/*; do
              [ -f "$file" ] || continue
              filename=$(basename "$file")
              ext="${filename##*.}"
              base="${filename%.*}"
              cp "$file" "release/${base}-${platform}.${ext}"
            done
          done
          cd release
          sha256sum * > checksums.sha256
          echo "Release files:"
          ls -la

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cat > release_notes.md << EOF
          # Glyphana ${VERSION}

          Unicode Glyph Explorer -- browse, search, and collect Unicode characters.

          ## Installation

          ### Linux
          Install the \`.deb\` package:
          \`\`\`bash
          sudo dpkg -i glyphana_*-linux-x86_64.deb
          \`\`\`
          Or run the portable \`.AppImage\` directly (\`chmod +x\` it first).

          ### macOS
          Open the \`.dmg\` and drag Glyphana to Applications. The build is
          unsigned, so on first launch right-click the app and choose *Open*.

          ### Windows
          Run the \`.msi\` installer. The build is unsigned, so SmartScreen may
          warn -- choose *More info* then *Run anyway*.

          ## Checksums
          SHA256 checksums are in \`checksums.sha256\`.
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Glyphana ${{ steps.version.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          files: |
            release/*.deb
            release/*.AppImage
            release/*.dmg
            release/*.msi
            release/checksums.sha256
