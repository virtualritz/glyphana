# CI that:
#
# * checks for a Git Tag that looks like a release
# * builds packages for Linux (.deb), macOS (.dmg), and Windows (.msi)
# * creates a Github Release™ and uploads the packages
#
# This workflow will trigger on version tags like:
# v1.0.0, v2.1.3, v0.1.0-alpha, etc.
name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build - ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}

    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux-x86_64
            os: ubuntu-20.04
            target: x86_64-unknown-linux-gnu
            formats: deb

          - name: macOS-x86_64
            os: macos-11
            target: x86_64-apple-darwin
            formats: dmg

          - name: macOS-aarch64
            os: macos-11
            target: aarch64-apple-darwin
            formats: dmg

          - name: Windows-x86_64
            os: windows-2019
            target: x86_64-pc-windows-msvc
            formats: msi

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Setup Rust cache
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform.target }}

      - name: Install Linux dependencies
        if: matrix.platform.os == 'ubuntu-20.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libayatana-appindicator3-dev

      - name: Install cargo-packager
        run: |
          cargo install cargo-packager --locked

      - name: Build application
        run: |
          cargo build --release --target ${{ matrix.platform.target }}

      - name: Prepare for packaging
        run: |
          # Ensure binary is in expected location for cargo-packager
          mkdir -p target/release
          if [ "${{ matrix.platform.os }}" = "windows-2019" ]; then
            cp target/${{ matrix.platform.target }}/release/glyphana.exe target/release/glyphana.exe 2>/dev/null || true
          else
            cp target/${{ matrix.platform.target }}/release/glyphana target/release/glyphana 2>/dev/null || true
          fi
        shell: bash

      - name: Package application
        run: |
          cargo packager --release --formats ${{ matrix.platform.formats }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: glyphana-${{ matrix.platform.name }}
          path: |
            dist/*.deb
            dist/*.dmg
            dist/*.msi
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release

          # Move all packages to release directory with platform names
          for dir in artifacts/glyphana-*; do
            platform=$(basename "$dir" | sed 's/glyphana-//')
            for file in "$dir"/*; do
              if [ -f "$file" ]; then
                filename=$(basename "$file")
                extension="${filename##*.}"
                base="${filename%.*}"
                newname="${base}-${platform}.${extension}"
                cp "$file" "release/$newname"
              fi
            done
          done

          # Create checksums
          cd release
          sha256sum * > checksums.sha256
          cd ..

          # Display final files
          echo "Release files:"
          ls -la release/

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: release_notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cat > release_notes.md << EOF
          # Glyphana ${VERSION}

          Unicode Glyph Explorer - Browse, search, and collect Unicode characters.

          ## Installation

          ### Linux
          Download the \`.deb\` package and install with:
          \`\`\`bash
          sudo dpkg -i glyphana_*.deb
          \`\`\`

          ### macOS
          Download the \`.dmg\` file, open it, and drag Glyphana to your Applications folder.

          ### Windows
          Download the \`.msi\` installer and run it.

          ## Features
          - Browse Unicode blocks and categories
          - Search glyphs by name or character
          - Drag-and-drop category organization
          - Recently used glyph tracking
          - Glyph collection management
          - Multi-font support (Noto fonts)
          - Fuzzy string matching with edit distance
          - System tray support

          ## Checksums
          SHA256 checksums are available in \`checksums.sha256\`
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Glyphana ${{ steps.version.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          files: |
            release/*.deb
            release/*.dmg
            release/*.msi
            release/checksums.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
