[package]
name = "glyphana"
version = "0.2.2"
authors = ["Moritz Moeller <virtualritz@gmail.com>"]
edition = "2024"
description = "Quickly find, inspect & collect unicode glyps"
rust-version = "1.92"
license = "(MIT OR Apache-2.0 OR BSD-3-Clause) AND OFL-1.1"
exclude = [".github/**/*", "wix/*"]
readme = "README.md"
documentation = "https://docs.rs/glyphana/"
repository = "https://github.com/virtualritz/glyphana/"
#debug = true
#split-debuginfo = "packed"

# Native desktop packaging via cargo-packager (.deb/.AppImage, .dmg, .msi).
# See .github/workflows/release.yml for the CI that builds these on tag push.
[package.metadata.packager]
before-packaging-command = "cargo build --release"
product-name = "Glyphana"
identifier = "com.virtualritz.glyphana"
description = "Quickly find, inspect & collect unicode glyphs"
long-description = """
Glyphana is a Unicode glyph explorer. Browse Unicode blocks and categories,
search glyphs by name or character with fuzzy matching, inspect individual
glyphs across fonts, and collect the ones you need.
"""
homepage = "https://github.com/virtualritz/glyphana"
authors = ["Moritz Moeller <virtualritz@gmail.com>"]
publisher = "Moritz Moeller"
copyright = "Copyright (c) 2026 Moritz Moeller"
category = "Utility"
# Fonts and the app icon are embedded in the binary, so no `resources` are
# bundled. cargo-packager picks the right icon size/format per platform and
# generates the macOS .icns from these PNGs.
icons = [
    "assets/icon-32.png",
    "assets/icon-128.png",
    "assets/icon-256.png",
    "assets/icon-512.png",
    "assets/icon-1024.png",
    "assets/icon.ico",
]
out-dir = "dist"

[package.metadata.packager.deb]
# Runtime shared libraries the binary links against (GTK tray + windowing).
depends = [
    "libgtk-3-0",
    "libxdo3",
    "libxkbcommon0",
    "libwayland-client0",
    "libayatana-appindicator3-1",
]
section = "utils"
desktop-template = "packaging/glyphana.desktop"

[package.metadata.packager.dmg]
# cargo-packager defaults for the macOS .dmg window layout.

[package.metadata.packager.wix]
# cargo-packager defaults for the Windows .msi (WiX) installer.

[lib]
name = "glyphana"
path = "src/lib.rs"

[[bin]]
name = "glyphana"
path = "src/main.rs"

[features]
default = []
## Make `egui` comptaible with screen readers. **Adds a lot of dependencies.**
accesskit = ["eframe/accesskit"]
# Alternative backend if default, `glow`, gives your trouble.
wgpu = ["eframe/wgpu"]

[dependencies]
ahash = "0.8"
anyhow = "1"
dirs = "6"
eframe = { version = "0.34", default-features = false, features = [
    "default_fonts", # Embed the default egui fonts.
    "glow",          # Use the glow rendering backend. Alternative: "wgpu".
    "persistence",   # Enable restoring app state when restarting the app.
    "wayland",       # Enable wayland support for Linux
    "x11",           # Enable X11 support for Linux
] }
egui = "0.34"
egui-file-dialog = "0.13"
egui-notify = "0.22"
egui_dnd = "0.15"
finl_unicode = "1"
glyph-names = "0.2"
#google-fonts = { version = "0.1", default-features = false, features = ["static"] }
google-fonts = { git = "https://github.com/virtualritz/google-fonts", branch = "feature/optimize-compile-times", default-features = false, features = [
    "static",
    "native-tls",
] }
include-flate = "0.3"
rusttype = "0.9"
serde = { version = "1", features = ["derive"] }
stringzilla = { version = "4", features = ["cpus"] }
textwrap = "0.16"
tray-icon = "0.24"
ttf-parser = "0.25"
unicode-blocks = "0.1"
unicode-case-mapping = "1"
unicode-normalization = "0.1"
unicode_names2 = "2"
unicode_skeleton = "0.1"

# native:
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tracing-subscriber = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[profile.release]
opt-level = 3     # 2 = fast and small
codegen-units = 1
lto = true
strip = true
panic = "abort"

# Optimize all dependencies even in debug builds:
[profile.dev.package."*"]
opt-level = 2
#incremental = true

# generated by 'cargo dist init'
[profile.dist]
inherits = "release"
